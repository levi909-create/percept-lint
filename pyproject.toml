[project]
name = "percept-lint"
version = "0.2.2"
description = "Utterance-time honesty linting for AI companions: catches first-person claims of sensor data the agent has no sensor for."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Levi Guffey", email = "leviguffey004@gmail.com" }]
requires-python = ">=3.9"
keywords = [
  "llm",
  "ai-companions",
  "honesty",
  "hallucination-detection",
  "linting",
  "ai-safety",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/levi909-create/percept-lint"
Repository = "https://github.com/levi909-create/percept-lint"
Issues = "https://github.com/levi909-create/percept-lint/issues"
"Research record" = "https://github.com/levi909-create/open-subject-prereg"
"Author on X" = "https://x.com/levi909123"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
