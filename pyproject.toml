[project]
name = "percept-lint"
version = "0.1.0.dev0"
description = "Utterance-time honesty linting for AI companions: catches first-person claims of sensor data the agent has no sensor for."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
